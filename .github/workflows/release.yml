name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build .app
        run: ./app/build-app.sh

      - name: Verify bundle structure
        run: |
          set -euo pipefail
          test -x "dist/IsolatedBrowser.app/Contents/MacOS/IsolatedBrowser"
          codesign --verify --deep --strict "dist/IsolatedBrowser.app"

      - name: Package .dmg
        run: ./app/build-dmg.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/IsolatedBrowser.dmg
          generate_release_notes: true
